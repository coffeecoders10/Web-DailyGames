<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">

<style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:390px;height:844px;overflow:hidden}

.seg b,.seg span{padding:7px 16px;color:#a89f88}.seg b{background:#2a271e;color:#f1ebdc}

.clue{font:500 22px/1.2 'Barlow Condensed';color:#f1ebdc;border-bottom:1px solid #3a362b;padding-bottom:12px}
.answer{display:flex;gap:6px;margin:16px 0 14px}

.row.solved i{color:#46c37b}.row.empty i,.row.empty b{background:#1b1912;opacity:.55}
.result{position:absolute;left:16px;right:16px;bottom:16px;background:#1f1c14;border:1px solid #3a362b;border-radius:12px;padding:16px}
.result h2{font:700 26px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;color:#46c37b}
.result p{font:500 17px 'Barlow Condensed';margin-top:4px}.result .note{color:#a89f88}
