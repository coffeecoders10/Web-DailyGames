<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Compiled, Bugs, and Errors</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:390px;height:844px;overflow:hidden}
.app{position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column}
body{background:#f6f6f1;color:#111;font-family:'Hanken Grotesk',sans-serif}
.app{padding:0 16px 16px;background-color:#f6f6f1;background-image:linear-gradient(#cfd5ff 1px,transparent 1px),linear-gradient(90deg,#cfd5ff 1px,transparent 1px);background-size:22px 22px}
header{padding:16px 0 0}h1{font:800 16px 'Hanken Grotesk'}
.bar{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.seg{display:flex;border:1px solid #1f3bff;font:600 14px 'Hanken Grotesk'}.seg b,.seg span{padding:7px 14px}.seg b{background:#1f3bff;color:#fff}
.meta{font:600 14px 'Hanken Grotesk';color:#1f3bff}
.clue{font:600 19px/1.25 'Hanken Grotesk'}
.answer{display:flex;margin:16px 0 14px;border:2px solid #1f3bff}
.answer i{flex:1;height:76px;display:grid;place-items:center;font:900 54px 'Hanken Grotesk';font-style:normal;color:#fff;background:#1f3bff;border-right:2px solid #f6f6f1}
.cols{display:none}
.rows{display:flex;flex-direction:column;background:#f6f6f1;border:1px solid #1f3bff}
.row{display:flex;border-bottom:1px solid #1f3bff}.row:last-child{border:0}
.row i{width:44px;height:44px;display:grid;place-items:center;font:700 22px 'Hanken Grotesk';font-style:normal;border-right:1px solid #1f3bff}
.row i:nth-child(5){margin-right:auto}
.row b{width:44px;height:44px;display:grid;place-items:center;font:700 18px 'Hanken Grotesk';border-left:1px solid #1f3bff}
.row .c{background:#1f3bff;color:#fff}.row .g{background:repeating-linear-gradient(135deg,#1f3bff 0 2px,#f6f6f1 2px 7px);color:#111}.row .e{color:#1f3bff}.row .z{background:none;color:#9aa6ff}
.row.solved i{background:#1f3bff;color:#fff}
.row.empty i,.row.empty b{opacity:.5}
.result{position:absolute;left:16px;right:16px;bottom:16px;background:#f6f6f1;border:2px solid #1f3bff;padding:14px 16px}
.result h2{font:800 26px 'Hanken Grotesk';color:#1f3bff}.result p{font:500 15px 'Hanken Grotesk';margin-top:3px}.result .note{color:#555}
.result button{margin-top:10px;width:100%;height:46px;border:0;background:#1f3bff;color:#fff;font:700 16px 'Hanken Grotesk'}</style></head><body><div class="app">

</div>

</div></body></html>
